[build-system]
requires = [
  # pin below 1.32.0: that release bumped the default Core-Metadata
  # version to 2.5, which twine/gh-action-pypi-publish can't validate
  # yet (https://github.com/pypa/twine/issues/1327)
  "hatchling<1.32.0",
  "hatch-cython",
  "cython>=0.29.32",
  "numpy>=2.0",
  "setuptools",
]
build-backend = "hatchling.build"

[project]
name = "color-operations"
description = "Apply basic color-oriented image operations."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Charlie Loyd", email = "charlie@mapbox.com"},
]
maintainers = [
  {name = "Vincent Sarago", email = "vincent@developmentseed.com"},
]
keywords = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Scientific/Engineering :: GIS",
]
dynamic = ["version"]
dependencies = [
  "numpy",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "colormath==2.0.2",
  "pre-commit",
  "bump-my-version",
]

[project.urls]
Homepage = "https://github.com/vincentsarago/color-operations"
Source = "https://github.com/vincentsarago/color-operations"
Issues = "https://github.com/vincentsarago/color-operations/issues"

# hatch-cython builds the Cython extension via an internal setuptools call
# that reads this pyproject.toml directly; without an explicit `packages`
# here setuptools' own auto-discovery gets confused by top-level non-package
# directories (e.g. img/) and refuses to build. Not read by hatchling itself.
[tool.setuptools]
packages = ["color_operations"]

[tool.hatch.version]
path = "color_operations/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["color_operations"]

[tool.hatch.build.targets.sdist]
include = [
  "/color_operations",
  "/tests",
  "/CHANGES.md",
  "/LICENSE",
  "/README.md",
]

[tool.hatch.build.targets.wheel.hooks.cython]
dependencies = ["hatch-cython"]

[tool.hatch.build.targets.wheel.hooks.cython.options]
src = "color_operations"
include_numpy = true
compile_py = false
compile_args = ["-O2"]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
known_first_party = ["color_operations"]
known_third_party = ["numpy"]
default_section = "THIRDPARTY"

[tool.mypy]
no_strict_optional = "True"

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = [
    "D1", # pydocstyle errors
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # flake8
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "B905",  # ignore zip() without an explicit strict= parameter, only support with python >3.10
]

[tool.ruff.lint.mccabe]
max-complexity = 14


[tool.bumpversion]
current_version = "0.4.0"
search = "{current_version}"
replace = "{new_version}"
regex = false
tag = true
commit = true
tag_name = "{new_version}"

[[tool.bumpversion.files]]
filename = "color_operations/__init__.py"
search = '__version__ = "{current_version}"'
replace = '__version__ = "{new_version}"'
